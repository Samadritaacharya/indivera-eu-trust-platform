name: IndiVera CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Security and functional checks
        run: npm run check
      - name: Live production smoke
        run: |
          set -euo pipefail
          BASE="https://indivera-eu-trust-platform.vercel.app"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$BASE/" -o /tmp/indivera-home.html && \
               curl --fail --silent --show-error "$BASE/api/indivera/health" -o /tmp/indivera-health.json; then
              grep -q "INDIVERA" /tmp/indivera-home.html
              grep -q '"ok":true' /tmp/indivera-health.json
              echo "Live URL verified: $BASE"
              cat /tmp/indivera-health.json
              exit 0
            fi
            sleep 10
          done
          echo "Production smoke test failed" >&2
          exit 1
